name: 🐉 Kali Linux SSH (Docker + Tailscale, works with Termius)

on:
  workflow_dispatch:
    inputs:
      tailscale_key:
        description: 'Enter your Tailscale Auth Key (tskey-auth-...)'
        required: true
        default: ''
      kali_password:
        description: 'Choose a password for the kali user'
        required: true
        default: ''
      ssh_public_key:
        description: 'Optional: paste your SSH public key (ssh-ed25519 AAAA...) for key login'
        required: false
        default: ''
      tools_set:
        description: 'Kali tools package (kali-tools-top10 / kali-linux-default / kali-linux-headless)'
        required: true
        default: 'kali-tools-top10'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    - name: 🧹 Free Up Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                    /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                    /usr/share/swift /usr/local/.ghcup /opt/microsoft \
                    /usr/local/share/powershell /usr/local/julia* || true
        sudo apt-get clean
        docker system prune -af || true
        df -h /

    - name: 💾 Add 8GB Swap
      run: |
        sudo swapoff -a || true
        sudo fallocate -l 8G /mnt/swapfile
        sudo chmod 600 /mnt/swapfile
        sudo mkswap /mnt/swapfile
        sudo swapon /mnt/swapfile
        free -h

    - name: ⬇️ Install & Connect Tailscale
      env:
        TS_KEY: ${{ github.event.inputs.tailscale_key }}
      run: |
        curl -fsSL https://tailscale.com/install.sh | sh
        sudo tailscale up --authkey="$TS_KEY" --hostname=kali-ssh --accept-routes
        sleep 3
        echo "TS_IP=$(tailscale ip -4)" >> $GITHUB_ENV

    - name: 🐉 Start Kali Container (SSH on host port 2222)
      run: |
        sudo mkdir -p /mnt/kali-data
        sudo chmod 777 /mnt/kali-data
        docker pull kalilinux/kali-rolling
        docker run -d --name kali \
          --shm-size=2g \
          -p 2222:22 \
          -v /mnt/kali-data:/data \
          kalilinux/kali-rolling sleep infinity

    - name: 🛠️ Install OpenSSH Server + Kali Tools
      env:
        TOOLS: ${{ github.event.inputs.tools_set }}
      run: |
        docker exec -e DEBIAN_FRONTEND=noninteractive -e TOOLS="$TOOLS" kali bash -c '
          apt-get update &&
          apt-get install -y openssh-server sudo curl wget git nano vim \
            net-tools iputils-ping tmux "$TOOLS"
        '

    - name: 🔐 Configure User & Start SSH
      env:
        KALI_PASS: ${{ github.event.inputs.kali_password }}
        SSH_KEY: ${{ github.event.inputs.ssh_public_key }}
      run: |
        docker exec -e KALI_PASS="$KALI_PASS" -e SSH_KEY="$SSH_KEY" kali bash -c '
          useradd -m -s /bin/bash -G sudo kali
          echo "kali:$KALI_PASS" | chpasswd
          echo "kali ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/kali
          chmod 440 /etc/sudoers.d/kali

          if [ -n "$SSH_KEY" ]; then
            mkdir -p /home/kali/.ssh
            echo "$SSH_KEY" > /home/kali/.ssh/authorized_keys
            chmod 700 /home/kali/.ssh
            chmod 600 /home/kali/.ssh/authorized_keys
            chown -R kali:kali /home/kali/.ssh
          fi

          ssh-keygen -A
          mkdir -p /run/sshd
          sed -i "s/^#\?PasswordAuthentication.*/PasswordAuthentication yes/" /etc/ssh/sshd_config
          sed -i "s/^#\?PermitRootLogin.*/PermitRootLogin no/" /etc/ssh/sshd_config
          echo "ClientAliveInterval 60" >> /etc/ssh/sshd_config
          echo "ClientAliveCountMax 120" >> /etc/ssh/sshd_config

          /usr/sbin/sshd
          sleep 2
          if pgrep -x sshd > /dev/null; then
            echo "sshd is running on port 22 (container)"
          else
            echo "sshd failed to start. Config test:"
            /usr/sbin/sshd -t
            exit 1
          fi
        '

    - name: ✅ Test SSH Port
      run: |
        timeout 10 bash -c "</dev/tcp/127.0.0.1/2222" && echo "Port 2222 is open" || (echo "Port 2222 not reachable"; docker logs kali; exit 1)

    - name: 🎉 Connection Details
      run: |
        echo "=================================================================="
        echo "🐉 YOUR KALI LINUX SSH IS READY!"
        echo "=================================================================="
        echo "🖥️  Host / IP      : $TS_IP"
        echo "🔌  Port           : 2222"
        echo "👤  Username       : kali"
        echo "🔑  Password       : (the one you entered when starting the workflow)"
        echo "💻  Command        : ssh kali@$TS_IP -p 2222"
        echo "⏱️  Duration       : up to 6 hours (GitHub max limit)"
        echo "=================================================================="

    - name: ⏳ Keep-Alive Runner (Up to 6 Hours Active)
      run: |
        total=350
        for i in $(seq 1 $total); do
          sleep 60
          if [ $((i % 10)) -eq 0 ]; then
            echo "🟢 Kali SSH Active: $i / $total minutes"
            docker ps --filter name=kali --format '{{.Status}}'
          fi
        done
